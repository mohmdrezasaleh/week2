services:
  web:
    build:
    context: .
    dockerfile: Dockerfile
  container_name: fastapi_web
  ports:
    - "8000:8000"
  environment:
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: 0
    REDIS_PASSWORD: ""
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - app_network


  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["cmd", "redis-cli", ping]
      interval: 5s
      timeout: 3s
      retries: 5
      
    networks:
      - app_network


volumes:
 redis_data:

networks:
  app_network:
    driver: bridge

